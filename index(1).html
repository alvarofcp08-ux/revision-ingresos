<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXOCORP · Revisión diferencias ingresos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f3fb;--card:#fff;--tx:#1b2430;--mu:#667085;--bd:#e1e5ea;--ac:#4b3fe0;--ok:#1a7f4b;--wa:#b26a00;--er:#c0392b;--okb:#e3f4ea;--wab:#fff1dc;--erb:#fbe4e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d0a24;--card:#161237;--tx:#e8ecf1;--mu:#98a2b3;--bd:#2c2661;--ac:#8b82ff;--ok:#4cc58a;--wa:#f0b04a;--er:#ef7a6c;--okb:#173325;--wab:#3a2b12;--erb:#3b1d1a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}.k b,.t{font-variant-numeric:tabular-nums}
h1{font-size:20px;margin:4px 0 2px}p.s{color:var(--mu);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.drop{border:2px dashed var(--bd);border-radius:10px;padding:12px;text-align:center;cursor:pointer}
.drop.ok{border-style:solid;border-color:var(--ok)}
.drop b{display:block}.drop small{color:var(--mu)}
input[type=file]{display:none}
.kpis{display:flex;gap:10px;flex-wrap:wrap}.k{flex:1;min-width:110px;border-radius:10px;padding:10px;background:var(--bg)}
.k b{font-size:22px;display:block}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600}
.t{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.OK{background:var(--okb);color:var(--ok)}.DIF{background:var(--wab);color:var(--wa)}.ERR{background:var(--erb);color:var(--er)}
tr.c{cursor:pointer}tr.c:hover{background:var(--bg)}
button,select{font:inherit;padding:7px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
input.q{font:inherit;padding:7px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);flex:1;min-width:160px}
.m{color:var(--mu);font-size:13px}
.brand{background:radial-gradient(120% 140% at 0% 0%,#2a1f8f 0%,#120d3a 55%,#0a0720 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 18px;margin:calc(-1*env(safe-area-inset-top,0px)) 0 0;border-bottom:3px solid #6b5cff}
.brand .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:16px}
.brand img{width:84px;height:auto;border-radius:12px;box-shadow:0 0 0 1px #4b3fe055,0 6px 24px #4b3fe066}
.brand .nx{font-size:38px;font-weight:800;letter-spacing:.22em;line-height:1;background:linear-gradient(90deg,#fff,#b9b2ff 60%,#8b82ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .pj{margin-top:8px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#cfcaff;font-weight:600}
@media(max-width:520px){.brand img{width:60px}.brand .nx{font-size:26px}.brand .pj{font-size:12px}}
.foot{text-align:center;color:var(--mu);font-size:12px;letter-spacing:.2em;margin:18px 0 6px}
</style>
</head>

<h1 style="display:none">Revisión diferencias ingresos</h1>
<p class="s">Detecta qué se recepcionó en el WMS y no se replicó en el Kardex. Sirve para un día o para un acumulado semanal. Todo se procesa en tu navegador y no se guarda nada.</p>

<div class="grid">
<label class="drop" id="d1"><input type="file" accept=".xlsx,.xls,.csv" data-k="ib"><b>1. IB Shipment</b><small id="n1">Subir archivo</small></label>

<script>
const S={ib:null,kx:null,wms:null,sel:null};
const norm=s=>String(s??'').trim().toUpperCase().replace(/^0+(?=\d)/,'');
const $=id=>document.getElementById(id);
function sheetRows(wb,test){
  for(const n of wb.SheetNames){
    const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true});
    for(let i=0;i<Math.min(a.length,40);i++){
      const h=(a[i]||[]).map(x=>String(x??''));
      if(test(h)){const hd=h.map((x,j)=>x||('Col'+(j+1)));return {hd,rows:a.slice(i+1).filter(r=>r.some(v=>v!==null&&v!==''))}}
    }
  }
  return null;
}
const first=h=>h.filter(x=>x).length>=3;
document.querySelectorAll('input[type=file]').forEach(inp=>inp.onchange=async e=>{
  const f=e.target.files[0];if(!f)return;const k=inp.dataset.k;
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
  let t=first;
  if(k==='ib')t=h=>h.some(x=>/nro asn/i.test(x));
  if(k==='kx')t=h=>h.some(x=>/^documento$/i.test(x));
  const d=sheetRows(wb,t);
  if(!d){alert('No pude leer la tabla de '+f.name);return}
  S[k]=d;const i={ib:1,kx:2,wms:3}[k];
  $('d'+i).classList.add('ok');$('n'+i).textContent=f.name+' · '+d.rows.length+' filas';
  if(k==='wms')guessWms();
  run();
});
const col=(hd,re)=>hd.findIndex(x=>re.test(x));
function agg(){
  const ib={},kx={};
  const {hd:h1,rows:r1}=S.ib,oc=col(h1,/de OC/i),it=col(h1,/culos/i);
  r1.forEach(r=>{const o=norm(r[oc]);if(!o)return;ib[o]=(ib[o]||0)+(Number(r[it])||0)});
  const {hd:h2,rows:r2}=S.kx,dc=col(h2,/^documento$/i);
  r2.forEach(r=>{const o=norm(r[dc]);if(!/^OC-/.test(o))return;kx[o]=(kx[o]||0)+1});
  return Object.keys({...ib,...kx}).sort().map(o=>{
    const a=ib[o]??null,b=kx[o]??null;
    let est='OK',nota='';
    if(a===null){est='DIF';nota='Solo en Kardex (¿ASN de otro día?)'}
    else if(b===null){est='DIF';nota='No ingresó nada al Kardex'}
    else if(a!==b){est='DIF';nota=(a>b?'Faltan ':'Sobran ')+Math.abs(a-b)+' líneas en Kardex'}
    return {oc:o,ib:a,kx:b,est,nota};
  });
}
let R=[];
function run(){
  if(!S.ib||!S.kx)return;
  R=agg();$('res').hidden=false;draw();
  const n=x=>R.filter(r=>r.est===x).length;
  $('kp').innerHTML=`<div class="k"><b>${R.length}</b>OC totales</div><div class="k"><b style="color:var(--ok)">${n('OK')}</b>Cuadran</div><div class="k"><b style="color:var(--wa)">${n('DIF')}</b>Con diferencia</div>`;
}
function draw(){
  const q=$('q').value.toUpperCase(),f=$('f').value;
  $('tb').innerHTML='<tr><th>OC</th><th>Líneas IB</th><th>Líneas Kardex</th><th>Estado</th><th>Observación</th></tr>'+
  R.filter(r=>r.oc.includes(q)&&(!f||r.est===f)).map(r=>`<tr class="${r.est==='DIF'?'c':''}" data-oc="${r.oc}"><td>${r.oc}</td><td>${r.ib??'—'}</td><td>${r.kx??'—'}</td><td><span class="t ${r.est}">${r.est==='OK'?'Cuadra':'Diferencia'}</span></td><td>${r.nota}</td></tr>`).join('');
  document.querySelectorAll('tr.c').forEach(tr=>tr.onclick=()=>detail(tr.dataset.oc));
}
$('q').oninput=draw;$('f').onchange=draw;
function guessWms(){S.map={oc:col(S.wms.hd,/\boc\b|orden|po\b/i),sku:col(S.wms.hd,/art[ií]culo|sku|c[oó]d|producto|item/i),des:col(S.wms.hd,/desc|nombre/i),qty:col(S.wms.hd,/cant|qty|unid/i)};if(S.sel)detail(S.sel)}
function opts(hd,v){return '<option value="-1">— ninguna —</option>'+hd.map((x,i)=>`<option value="${i}" ${i===v?'selected':''}>${x}</option>`).join('')}
function detail(oc){
  S.sel=oc;const d=$('det');d.hidden=false;
  const kxr=S.kx.rows,h=S.kx.hd,dc=col(h,/^documento$/i),ac=col(h,/^articulo$/i),nc=col(h,/descrip/i),qc=col(h,/^cantidad$/i);
  const inK=kxr.filter(r=>norm(r[dc])===oc);
  let html=`<h3 style="margin:0 0 8px">${oc}</h3>`;
  if(!S.wms){
    html+=`<p class="m">Sube el <b>WMS detalle por OC</b> (paso 3) para ver qué productos faltaron. Mientras tanto, esto es lo que sí ingresó al Kardex (${inK.length} líneas):</p>`+
    tabla(['Artículo','Descripción','Cantidad'],inK.map(r=>[r[ac],r[nc],r[qc]]));
    d.innerHTML=html;d.scrollIntoView({behavior:'smooth'});return;
  }
  const m=S.map,W=S.wms;
  html+=`<div class="row m">Columnas del WMS: OC <select id="mo">${opts(W.hd,m.oc)}</select> Producto <select id="ms">${opts(W.hd,m.sku)}</select> Descripción <select id="md">${opts(W.hd,m.des)}</select> Cantidad <select id="mq">${opts(W.hd,m.qty)}</select></div>`;
  const wr=W.rows.filter(r=>m.oc<0||norm(r[m.oc]).includes(oc.replace('OC-','')) );
  const kset=new Map();inK.forEach(r=>kset.set(norm(r[ac]),(kset.get(norm(r[ac]))||0)+(Number(r[qc])||0)));
  const ws=new Map();
  wr.forEach(r=>{const s=norm(r[m.sku]);if(!s)return;const o=ws.get(s)||{d:m.des>=0?r[m.des]:'',q:0};o.q+=m.qty>=0?(Number(r[m.qty])||0):0;ws.set(s,o)});
  const falt=[],parc=[],ok=[];
  ws.forEach((o,s)=>{const k=kset.get(s);if(k===undefined)falt.push([s,o.d,o.q,0,'No ingresado']);else if(m.qty>=0&&k!==o.q)parc.push([s,o.d,o.q,k,k<o.q?'Ingreso incompleto':'Ingresó de más']);else ok.push([s,o.d,o.q,k,'OK'])});
  const extra=[...kset].filter(([s])=>!ws.has(s)).map(([s,q])=>[s,'',0,q,'En Kardex, no en WMS']);
  window._falt=[...falt,...parc,...extra];
  html+=`<div class="kpis"><div class="k"><b style="color:var(--er)">${falt.length}</b>No ingresados</div><div class="k"><b style="color:var(--wa)">${parc.length}</b>Cantidad distinta</div><div class="k"><b style="color:var(--ok)">${ok.length}</b>Correctos</div></div>`;
  if(!ws.size)html+=`<p class="m">No encontré productos de esta OC en el WMS. Revisa la columna de OC.</p>`;
  html+=tabla(['Producto','Descripción','Cant. WMS','Cant. Kardex','Resultado'],window._falt.length?window._falt:[]);
  html+=`<div class="row"><button class="p" id="ef">Exportar faltantes</button></div>`;
  d.innerHTML=html;
  ['mo:oc','ms:sku','md:des','mq:qty'].forEach(p=>{const[i,k]=p.split(':');$(i).onchange=e=>{S.map[k]=+e.target.value;detail(oc)}});
  $('ef').onclick=()=>csv([['Producto','Descripción','Cant WMS','Cant Kardex','Resultado'],...window._falt],'faltantes_'+oc+'.csv');
  d.scrollIntoView({behavior:'smooth'});
}
function tabla(h,rows){return `<div class="wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>i===r.length-1&&h[h.length-1]==='Resultado'?`<td><span class="t ${c==='OK'?'OK':c==='No ingresado'?'ERR':'DIF'}">${c}</span></td>`:`<td>${c??''}</td>`).join('')}</tr>`).join('')}</table></div>`}
function csv(a,n){const t=a.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');const b=new Blob(['\ufeff'+t],{type:'text/csv'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=n;l.click()}
$('ex').onclick=()=>csv([['OC','Líneas IB','Líneas Kardex','Estado','Observación'],...R.map(r=>[r.oc,r.ib,r.kx,r.est,r.nota])],'resumen_oc.csv');
</script>
</body>
</html>
